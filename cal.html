<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Friendship Calculator</title>
</head>

<body>

    <input type="text" id="name1" placeholder="Enter your name">

    <input type="text" id="name2" placeholder="Enter his/her name">

    <button onclick="cal()">Calculate</button>

    <h2 id="res">Result</h2>

    <script>
        function cal() {

            var name1 = document.getElementById("name1").value;

            var name2 = document.getElementById("name2").value;

            var result = Math.floor(Math.random() * 101);

            var res = document.getElementById("res");

            res.innerHTML =
                "The friendship percentage between " +
                name1 + " and " + name2 +
                " is: " + result + "%";
        }
    </script>

</body>

</html>
