<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Eligibility</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-image:
                linear-gradient(rgba(5, 20, 45, 0.55), rgba(5, 20, 45, 0.65)),
                url("https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=2000&q=85");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 850px;
            padding: 45px;
            border-radius: 28px;

            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.3);

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);

            color: white;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading .symbol {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .heading h1 {
            font-size: 42px;
            letter-spacing: 1px;
        }

        .heading p {
            margin-top: 10px;
            color: #e5e7eb;
            font-size: 16px;
        }

        .form-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.92);
            color: #172033;

            font-size: 16px;
        }

        .input-group input:focus {
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.6);
        }

        .full {
            grid-column: span 2;
        }

        button {
            grid-column: span 2;

            padding: 16px;

            border: none;
            border-radius: 12px;

            background: #ffb703;
            color: #172033;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #ffd166;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        #Answer {
            grid-column: span 2;

            min-height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 15px;

            border-radius: 12px;

            background: rgba(0, 0, 0, 0.25);

            font-size: 17px;
            font-weight: bold;

            text-align: center;
        }

        .eligible {
            background: rgba(34, 197, 94, 0.85) !important;
        }

        .not-eligible {
            background: rgba(220, 38, 38, 0.85) !important;
        }

        @media (max-width: 700px) {

            .box {
                width: 90%;
                padding: 30px;
            }

            .form-area {
                grid-template-columns: 1fr;
            }

            .full,
            button,
            #Answer {
                grid-column: span 1;
            }

            .heading h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="heading">
            <div class="symbol">🗳️</div>

            <h1>Can You Vote?</h1>

            <p>Check your voting eligibility in a few seconds</p>
        </div>

        <div class="form-area">

            <div class="input-group">
                <label>Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label>Age</label>
                <input
                    type="number"
                    id="age"
                    placeholder="Enter your age">
            </div>

            <div class="input-group full">
                <label>Country</label>
                <input
                    type="text"
                    id="country"
                    placeholder="Enter your country">
            </div>

            <button onclick="vote()">
                CHECK ELIGIBILITY
            </button>

            <div id="Answer">
                Your result will appear here
            </div>

        </div>

    </div>

    <script src="vote.js"></script>

</body>
</html>
